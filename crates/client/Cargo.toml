[package]
name = "cookie-communism"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
base64 = "0.23.1"
cookie-communism-proto = { version = "0.1.0", path = "../proto" }
cookie_store = "0.22.1"
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
reqwest = { version = "0.13.5", default-features = false, features = ["cookies", "rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["sync", "time", "fs", "macros", "rt"] }
tracing = "0.1.44"
url = "2.5.8"

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
axum = "0.8.9"
cookie-communism-relay = { path = "../relay" }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["full"] }
url = "2.5.8"
